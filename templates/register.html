{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h2>Создание аккаунта</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Зарегистрироваться</button>
</form>

<div class="links">
    Уже есть аккаунт?
    <a href="{% url 'login' %}">Войти</a>
</div>
{% endblock %}
