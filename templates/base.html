<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Django Lab{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
        }
        nav {
            background: #1e293b;
            padding: 20px 8%;
            color: white;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        .container {
            max-width: 480px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .errorlist {
            color: red;
        }
    </style>
</head>
<body>
    <nav>
        <strong>Django Lab</strong>
        <span style="float:right">
            <a href="{% url 'register' %}">Регистрация</a>
            <a href="{% url 'login' %}">Вход</a>
        </span>
    </nav>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
